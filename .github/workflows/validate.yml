name: Validate static portfolio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          for file in assets/js/*.js; do node --check "$file"; done
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8'))"
